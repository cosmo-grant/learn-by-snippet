<p>
  <code>reversed()</code> needs an object with <code>__reversed__()</code>, or a
  sequence (with <code>__len__()</code> and <code>__getitem__()</code>). A
  generator has neither: it produces items one at a time, with no idea what's
  coming.
</p>

<p>Use <code>reversed(list(...))</code> if you must.</p>
