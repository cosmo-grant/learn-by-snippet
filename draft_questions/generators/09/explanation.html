<p>
  Any <code>yield</code> in the body, even an unreachable one, makes a generator
  function. So <code>f(True)</code> returns a generator which ends immediately.
  Unpacking it gives no items, and <code>print()</code> prints just a newline.
</p>

<p>The returned <code>1</code> isn't an item, so isn't printed.</p>
