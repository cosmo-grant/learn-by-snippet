<p>
  The first <code>next()</code> runs the body, which raises. The
  <code>ConnectionError</code> propagates out of <code>next()</code> to the
  caller.
</p>

<p>
  A generator which raises is finished. The second <code>next()</code> raises
  <code>StopIteration</code>: <code>yield "ok"</code> is never reached.
</p>
