<p>
  <code>GeneratorExit</code> inherits from <code>BaseException</code>, not
  <code>Exception</code>, because it's not an error. So
  <code>except Exception</code> doesn't catch it, and <code>close()</code> works
  as normal.
</p>

<p>
  (Same idea as <code>KeyboardInterrupt</code> and <code>SystemExit</code>.)
</p>
