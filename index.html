<!doctype html>
<html lang="en-UK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Python By Quiz</title>
    <meta name="author" content="Cosmo Grant" />
    <meta
      name="description"
      content="Check your knowledge of Python fundamentals with these interactive quizzes."
    />
    <link rel="stylesheet" href="questions-vars.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="splash-screen">
      <h1>Python by quiz</h1>
      <p class="muted">
        Code tested in 3.14 with the GIL using
        <a href="https://github.com/cosmo-grant/snippet-checker"
          >snippet-checker</a
        >.
      </p>
      <div id="quiz-choices"></div>
      <footer>
        <a href="https://github.com/cosmo-grant/python-by-quiz">source</a>
      </footer>
    </div>

    <div id="nav-bar"></div>

    <div id="main-content">
      <div id="preface-text"></div>
      <pre
        id="snippet-pre"
      ><code id="snippet-code" class="lang-python"></code></pre>
      <button id="reveal-button">reveal answer</button>
      <pre id="output-pre"><samp id="output-samp"></samp></pre>
      <div id="explanation"></div>
      <div id="grading-section">
        <button id="incorrect-button">✘</button>
        <button id="correct-button">✔</button>
      </div>
      <button id="next-button">&gt;</button>
    </div>

    <div id="final-score-section">
      <p>
        <span id="final-score-value"></span>/<span id="final-score-max"></span>
      </p>
      <p id="final-score-message"></p>
      <p class="anki-plug">
        Want more? You might like
        <a href="https://ankiweb.net/shared/info/1924308445">my anki deck</a>.
      </p>
      <button id="more-quizzes-button">More quizzes</button>
    </div>

    <div id="continue-dialog">
      <div>
        <div>
          <h3>Continue quiz?</h3>
        </div>
        <div>
          <p>
            <span id="saved-title-dialog"></span>
            (on <span id="saved-question-dialog"></span> of
            <span id="total-questions-dialog"></span>)
          </p>
          <div>
            <button id="continue-from-saved-button">Continue</button>
            <button id="new-quiz-button">New quiz</button>
          </div>
        </div>
      </div>
    </div>
    <link rel="stylesheet" href="hljs-theme.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="questions_per_quiz.js"></script>
    <script src="quiz.js"></script>
  </body>
</html>
